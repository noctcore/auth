name: fuzz

# The property tests run on every push with a fixed seed and a few hundred
# cases each. Nightly they run with a new seed and many more cases, so the
# search keeps reaching inputs the fixed seed never generates. A failure
# prints its seed and counterexample path: rerun it locally with
# `FC_SEED=<seed> bunx vitest run tests/property` in packages/auth.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: 'fast-check seed (empty: the run id)'
        required: false
        default: ''
      runs:
        description: 'Cases per property'
        required: false
        default: '20000'

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz · property tests (nightly)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Inputs reach the shell only through env, never spliced into the script.
      - name: Pick the seed
        env:
          INPUT_SEED: ${{ inputs.seed }}
          INPUT_RUNS: ${{ inputs.runs }}
          RUN_ID: ${{ github.run_id }}
        run: |
          seed="${INPUT_SEED:-$RUN_ID}"
          runs="${INPUT_RUNS:-20000}"
          case "$seed" in ''|*[!0-9-]*) echo "seed must be an integer: $seed"; exit 1 ;; esac
          case "$runs" in ''|*[!0-9]*) echo "runs must be a whole number: $runs"; exit 1 ;; esac
          # fast-check takes a 32-bit seed; fold the run id into that range.
          seed=$(( seed % 2147483647 ))
          echo "fast-check seed: $seed, cases per property: $runs"
          echo "FC_SEED=$seed" >> "$GITHUB_ENV"
          echo "FC_NUM_RUNS=$runs" >> "$GITHUB_ENV"
      # The default 5 s test timeout is sized for the fixed-seed run.
      - name: Property tests
        working-directory: packages/auth
        run: bunx vitest run tests/property --testTimeout=1200000
