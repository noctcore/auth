name: release

# Changesets two-phase release:
#   - PRs land with a changeset (`bun run changeset`) describing which packages bump.
#   - On push to main, if changesets are pending, the Changesets bot opens or updates a
#     "Version Packages" PR (bumps versions and writes CHANGELOGs).
#   - Merging that PR (no pending changesets) runs the publish step.
#
# DRY RUN: the publish step is `bun run release:dry-run`, which builds and runs
# `npm publish --dry-run` per package. Nothing reaches npm, and no tags or GitHub
# releases are created. To publish for real once a trusted publisher is registered on
# npmjs.com for every package (see CONTRIBUTING.md, "Releasing"), change
# `publish-script` below to `bunx changeset publish`. Publishing then goes through npm
# trusted publishing (OIDC: `id-token: write`, npm 11.5.1+), with provenance from
# publishConfig.provenance and NPM_CONFIG_PROVENANCE.
#
# changesets/action v2 creates the version commit, the release tags and their GitHub
# releases through the GitHub API with the `github-token` input, so the checkout keeps
# no git credentials.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Nothing at the top level: each job asks for exactly what it uses.
permissions: {}

jobs:
  release:
    name: version or publish (dry run)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # version commit, release tags and GitHub releases (via the API)
      pull-requests: write # open and update the "Version Packages" PR
      id-token: write # npm provenance and trusted publishing (OIDC), used once publishing is live
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # Node 24 ships npm 11. Trusted publishing needs npm 11.5.1 or later; there is
      # no npm token to fall back to.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Require npm with trusted publishing support
        run: |
          npm --version
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); if (a<11 || (a===11 && (b<5 || (b===5 && c<1)))) { console.error('npm ' + process.argv[1] + ' is older than 11.5.1, which trusted publishing needs'); process.exit(1) }" "$(npm --version)"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test
      - name: Create Version PR or publish (dry run)
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: bun run version-packages
          publish-script: bun run release:dry-run
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NPM_CONFIG_PROVENANCE: 'true'

      # changesets/action can't label the PR it opens. Its `pr-number` output is only set
      # on a versioning run. A failure here must not fail a run that may already have
      # published, hence continue-on-error.
      - name: Label and assign the Version Packages PR
        if: steps.changesets.outputs.pr-number != ''
        continue-on-error: true
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" -f 'labels[]=release' --silent
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/assignees" -f 'assignees[]=Shironex' --silent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.changesets.outputs.pr-number }}
