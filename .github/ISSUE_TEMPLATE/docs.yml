name: Docs
description: A README, guide page or source comment is wrong, unclear or missing.
labels: ['documentation', 'area: docs']
body:
  - type: input
    id: page
    attributes:
      label: Page or file
      description: A README section, a docs site page, or a source file whose header comment is off.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
      description: Docs that describe a weaker guarantee than the code gives are a docs bug. Docs that promise a stronger one than the code gives may be a security bug; see SECURITY.md.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording or sources (optional)
